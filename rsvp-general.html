<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>You're Invited</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Jost:wght@300;400;500;600&family=Mrs+Saint+Delafield&display=swap" rel="stylesheet">

<style>
  :root{
    --ivory:#F7F1E6;
    --ivory-deep:#EFE6D3;
    --forest:#1F3D2E;
    --forest-deep:#152C21;
    --cranberry:#7A2E2E;
    --gold:#B8935A;
    --gold-bright:#D9BA83;
    --brown:#3E2C23;
    --candle:#E8C468;
  }
  *{box-sizing:border-box;}
  body{
    background:var(--ivory);
    color:var(--brown);
    font-family:'Jost',sans-serif;
    min-height:100vh;
    margin:0;
    background-image:
      radial-gradient(circle at 15% 10%, rgba(184,147,90,0.10), transparent 40%),
      radial-gradient(circle at 85% 90%, rgba(122,46,46,0.08), transparent 45%);
  }

  /* Small framed portrait used across screens — printed-photo look */
  .portrait{
    width:100px; height:126px;
    object-fit:cover;
    display:block;
    margin:0 auto .9rem;
    padding:6px 6px 16px 6px;
    background:#fffdf8;
    box-shadow:0 8px 18px rgba(62,44,35,0.3);
    transform:rotate(-3deg);
    border-radius:2px;
  }
  .portrait-tuck{
    width:78px; height:98px;
    padding:4px 4px 12px 4px;
    transform:rotate(4deg);
    margin:0 auto .5rem;
  }
  .font-display{ font-family:'Cormorant Garamond', serif; }
  .font-script{ font-family:'Mrs Saint Delafield', cursive; }

  .frame{
    border:1px solid rgba(184,147,90,0.55);
    position:relative;
  }
  .frame::before{
    content:"";
    position:absolute; inset:6px;
    border:1px solid rgba(184,147,90,0.35);
    pointer-events:none;
  }

  .btn-primary{
    background:var(--forest);
    color:var(--ivory);
    font-family:'Jost',sans-serif;
    letter-spacing:.06em;
    transition:background .25s ease, transform .15s ease;
  }
  .btn-primary:hover{ background:var(--forest-deep); transform:translateY(-1px); }
  .btn-primary:disabled{ background:#9c9284; cursor:not-allowed; transform:none; }

  .btn-ghost{
    border:1px solid var(--brown);
    color:var(--brown);
    background:transparent;
    transition:all .2s ease;
  }
  .btn-ghost:hover{ background:rgba(62,44,35,0.06); }

  /* Progress: pine-sprig markers */
  .sprig{
    width:34px;height:34px;
    display:flex;align-items:center;justify-content:center;
    color:var(--gold);
    opacity:.35;
    transition:opacity .3s ease, color .3s ease, transform .3s ease;
  }
  .sprig.active{ opacity:1; color:var(--cranberry); transform:scale(1.12); }
  .sprig.done{ opacity:1; color:var(--forest); }
  .sprig-line{
    flex:1; height:1px; background:rgba(184,147,90,0.4); margin:0 2px;
    align-self:center;
  }

  /* Folded invitation with tied ribbon */
  .invite-3d{
    perspective:1400px;
  }
  .folded-invite{
    position:relative;
    min-height:520px;
  }
  .invite-inner-content{
    position:relative;
    z-index:1;
  }
  .invite-flap{
    position:absolute;
    inset:0;
    background:
      linear-gradient(155deg, var(--forest) 0%, var(--forest-deep) 75%);
    transform-origin:top center;
    transform-style:preserve-3d;
    backface-visibility:hidden;
    transform:rotateX(0deg);
    transition:transform 1.9s cubic-bezier(.76,0,.24,1), opacity .8s ease 1.1s;
    z-index:5;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    box-shadow:0 6px 18px rgba(0,0,0,0.25);
  }
  .invite-flap::after{
    content:"";
    position:absolute; inset:10px;
    border:1px solid rgba(232,196,104,0.35);
    pointer-events:none;
  }
  .invite-flap.opened{
    transform:rotateX(-118deg);
    opacity:0;
    pointer-events:none;
  }
  .flap-face{ text-align:center; position:relative; padding:1rem; }
  .flap-face p{ color:var(--gold-bright); }

  .ribbon-wrap{
    position:absolute;
    left:0; right:0; top:50%;
    transform:translateY(-50%);
    height:60px;
    z-index:10;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
  }
  .ribbon-strip{
    position:absolute; top:50%; transform:translateY(-50%);
    height:36px; width:54%;
    background:linear-gradient(180deg, #8a3232, var(--cranberry) 55%, #5e2020);
    box-shadow:0 3px 8px rgba(0,0,0,0.3);
  }
  .ribbon-strip.left{ left:0; border-radius:0 3px 3px 0; transform-origin:right center; }
  .ribbon-strip.right{ right:0; border-radius:3px 0 0 3px; transform-origin:left center; }

  /* Stage 1: the knot slowly loosens and the loops unwind */
  @keyframes knotLoosen{
    0%{ transform:scale(1) rotate(0deg); opacity:1; }
    45%{ transform:scale(1.12) rotate(10deg); opacity:1; }
    100%{ transform:scale(.25) rotate(50deg); opacity:0; }
  }
  @keyframes loopUnwindLeft{
    0%{ transform:rotate(0deg) scale(1); opacity:1; }
    35%{ transform:rotate(-18deg) scale(1.05); opacity:1; }
    100%{ transform:rotate(-95deg) scale(.25) translate(-14px,10px); opacity:0; }
  }
  @keyframes loopUnwindRight{
    0%{ transform:rotate(0deg) scale(1); opacity:1; }
    35%{ transform:rotate(18deg) scale(1.05); opacity:1; }
    100%{ transform:rotate(95deg) scale(.25) translate(14px,10px); opacity:0; }
  }
  /* Stage 2: once the knot is undone, the two ribbon halves slowly slide free */
  @keyframes stripSlideLeft{
    0%{ transform:translate(0,-50%) rotate(0deg); opacity:1; }
    55%{ transform:translate(-38%,-50%) rotate(-5deg); opacity:1; }
    100%{ transform:translate(-92%,-50%) rotate(-13deg); opacity:0; }
  }
  @keyframes stripSlideRight{
    0%{ transform:translate(0,-50%) rotate(0deg); opacity:1; }
    55%{ transform:translate(38%,-50%) rotate(5deg); opacity:1; }
    100%{ transform:translate(92%,-50%) rotate(13deg); opacity:0; }
  }

  .ribbon-wrap.untying .ribbon-strip.left{ animation:stripSlideLeft 1.1s cubic-bezier(.5,0,.35,1) .62s forwards; }
  .ribbon-wrap.untying .ribbon-strip.right{ animation:stripSlideRight 1.1s cubic-bezier(.5,0,.35,1) .68s forwards; }

  .ribbon-bow{
    position:relative; z-index:11;
    width:76px; height:76px;
  }
  .ribbon-bow #knot{ transform-box:fill-box; transform-origin:center; }
  .ribbon-bow #loopLeft{ transform-box:fill-box; transform-origin:center; }
  .ribbon-bow #loopRight{ transform-box:fill-box; transform-origin:center; }
  .ribbon-wrap.untying .ribbon-bow #knot{ animation:knotLoosen .75s cubic-bezier(.5,0,.35,1) forwards; }
  .ribbon-wrap.untying .ribbon-bow #loopLeft{ animation:loopUnwindLeft 1s cubic-bezier(.5,0,.35,1) .12s forwards; }
  .ribbon-wrap.untying .ribbon-bow #loopRight{ animation:loopUnwindRight 1s cubic-bezier(.5,0,.35,1) .2s forwards; }

  .invite-card{
    animation: rise .6s cubic-bezier(.22,1,.36,1) both;
  }
  @keyframes rise{
    from{ opacity:0; transform:translateY(14px); }
    to{ opacity:1; transform:translateY(0); }
  }

  /* Confirmation stamp on the thank-you screen */
  .confirm-stamp{
    width:96px;height:96px;border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #245a41, var(--forest) 60%, var(--forest-deep) 100%);
    box-shadow:0 10px 22px rgba(31,61,46,0.35), inset 0 2px 6px rgba(255,255,255,0.2);
    display:flex;align-items:center;justify-content:center;
    border:3px solid rgba(232,196,104,0.5);
  }
  .confirm-stamp svg{ width:44px;height:44px; }

  .divider{
    height:1px;
    background:linear-gradient(to right, transparent, rgba(184,147,90,0.7), transparent);
  }

  input[type="checkbox"].sprig-check{
    appearance:none; -webkit-appearance:none;
    width:22px;height:22px;
    border:1.5px solid var(--gold);
    border-radius:4px;
    display:inline-block;
    position:relative;
    cursor:pointer;
    flex-shrink:0;
    background:var(--ivory);
    transition:background .2s ease, border-color .2s ease;
  }
  input[type="checkbox"].sprig-check:checked{
    background:var(--forest);
    border-color:var(--forest);
  }
  input[type="checkbox"].sprig-check:checked::after{
    content:"";
    position:absolute; left:6px; top:2px;
    width:6px;height:11px;
    border:solid var(--ivory);
    border-width:0 2px 2px 0;
    transform:rotate(45deg);
  }

  .text-input{
    border:1px solid rgba(62,44,35,0.3);
    background:#fffdf8;
    padding:.6rem .8rem;
    border-radius:4px;
    width:100%;
    font-family:'Jost',sans-serif;
    transition:border-color .2s ease, box-shadow .2s ease;
  }
  .text-input:focus{
    outline:none;
    border-color:var(--gold);
    box-shadow:0 0 0 3px rgba(184,147,90,0.18);
  }

  .flag-note{
    font-size:.78rem;
    color:var(--cranberry);
  }

  .fade-step{ animation: fadeIn .4s ease both; }
  @keyframes fadeIn{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);} }

  @media (prefers-reduced-motion: reduce){
    *{ animation:none !important; transition:none !important; }
  }
</style>
</head>
<body class="flex items-center justify-center p-4 md:p-8">

<div id="app" class="w-full max-w-xl"></div>

<script>
/* ============================================================
   CONFIG — edit these values for your wedding
   ============================================================ */
const CONFIG = {
  APPS_SCRIPT_URL: "PASTE_YOUR_APPS_SCRIPT_WEB_APP_URL_HERE",
  COUPLE_NAMES: "Deniel & Partner",
  WEDDING_DATE_DISPLAY: "December 25, 2026",
  WEDDING_VENUE: "St. Joseph Parish & Garden Pavilion",
  RSVP_DEADLINE: "2026-12-01T23:59:59", // guests can't submit after this
  // Paste a direct image URL (hosted wherever you're hosting these HTML files,
  // e.g. a public Google Drive link, Imgur, or your own site). Leave the
  // placeholder as-is if you don't have a photo yet — the form works fine without one.
  COUPLE_PHOTO_URL: "PASTE_YOUR_PHOTO_URL_HERE",
};

function hasPhoto(){
  return CONFIG.COUPLE_PHOTO_URL && !CONFIG.COUPLE_PHOTO_URL.includes('PASTE_YOUR');
}

/* ============================================================
   Small helpers
   ============================================================ */
const $app = document.getElementById('app');
const params = new URLSearchParams(window.location.search);
const householdId = params.get('id');

function sprigIcon(){
  return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" width="18" height="18">
    <path d="M12 2c0 6-2 8-2 12s2 6 2 8"/>
    <path d="M12 6c-2 1-4 1-5 3"/>
    <path d="M12 10c2 1 4 1 5 3"/>
    <path d="M12 14c-2 1-3.5 1.5-4.5 3.5"/>
    <path d="M12 14c2 1 3.5 1.5 4.5 3.5"/>
  </svg>`;
}

function isPastDeadline(){
  return new Date() > new Date(CONFIG.RSVP_DEADLINE);
}

function formatDeadline(){
  const d = new Date(CONFIG.RSVP_DEADLINE);
  return d.toLocaleDateString(undefined, { month:'long', day:'numeric', year:'numeric' });
}

function isSuspiciousEntry(name){
  const trimmed = (name||"").trim();
  if (trimmed.length < 2) return true;
  if (/^(.)\1*$/.test(trimmed)) return true; // repeated single character e.g. "aaaa"
  if (!/[a-zA-Z]/.test(trimmed)) return true; // no letters at all
  return false;
}

/* ============================================================
   App state
   ============================================================ */
let state = {
  step: 0, // 0 = seal, 1 = welcome, 2 = details, 3 = review, 4 = done
  guest: null,
  answers: [], // array aligned to members/slots
};

/* ============================================================
   Render router
   ============================================================ */
function render(){
  if (!householdId){
    $app.innerHTML = errorCard("This invitation link is missing its code. Please use the exact link that was sent to you.");
    return;
  }
  if (state.loadError){
    $app.innerHTML = errorCard(state.loadError);
    return;
  }
  if (!state.guest){
    $app.innerHTML = loadingCard();
    return;
  }

  switch(state.step){
    case 0: $app.innerHTML = sealScreen(); attachSeal(); break;
    case 1: $app.innerHTML = welcomeScreen(); attachNav(); break;
    case 2: $app.innerHTML = detailsScreen(); attachDetails(); break;
    case 3: $app.innerHTML = reviewScreen(); attachReview(); break;
    case 4: $app.innerHTML = doneScreen(); break;
  }
}

function portraitHTML(extraClass){
  return hasPhoto()
    ? `<img src="${CONFIG.COUPLE_PHOTO_URL}" alt="${CONFIG.COUPLE_NAMES}" class="portrait ${extraClass || ''}">`
    : '';
}

function errorCard(msg){
  return `
  <div class="frame invite-card bg-[var(--ivory-deep)] rounded-sm p-8 text-center">
    <p class="font-display italic text-lg">${msg}</p>
  </div>`;
}

function loadingCard(){
  return `
  <div class="text-center p-10">
    <p class="font-display italic text-lg text-[var(--brown)]/70">Opening your invitation…</p>
  </div>`;
}

/* ---------- Step 0: Folded invitation ---------- */
function sealScreen(){
  return `
  <div class="invite-3d">
    <div class="folded-invite frame rounded-sm">

      <!-- Inner content, revealed once the flap opens -->
      <div class="invite-inner-content bg-[var(--ivory-deep)] p-10 md:p-14 text-center rounded-sm">
        ${portraitHTML()}
        <p class="uppercase tracking-[0.3em] text-xs text-[var(--gold)] mb-3">Together with their families</p>
        <h1 class="font-display text-4xl md:text-5xl mb-1">${CONFIG.COUPLE_NAMES}</h1>
        <p class="font-script text-3xl text-[var(--cranberry)] mt-1 mb-6">request the pleasure of your company</p>
        <div class="divider my-6"></div>
        <p class="text-sm mb-8">${CONFIG.WEDDING_DATE_DISPLAY} · ${CONFIG.WEDDING_VENUE}</p>
        <button id="continueBtn" class="btn-primary w-full py-3 rounded-sm text-sm uppercase tracking-widest opacity-0 pointer-events-none transition-opacity duration-500">
          Begin RSVP
        </button>
        ${!isPastDeadline() ? `<p class="text-xs mt-6 text-[var(--brown)]/50">Kindly respond by ${formatDeadline()}</p>` : `<p class="text-xs mt-6 text-[var(--cranberry)]">RSVPs closed on ${formatDeadline()}</p>`}
      </div>

      <!-- Folded flap covering the invitation until opened -->
      <div id="inviteFlap" class="invite-flap rounded-sm">
        <div class="flap-face">
          ${portraitHTML('portrait-tuck')}
          <p class="font-script text-3xl mb-1">${CONFIG.COUPLE_NAMES}</p>
          <p class="text-[10px] uppercase tracking-[0.3em] text-[var(--ivory)]/60">${CONFIG.WEDDING_DATE_DISPLAY}</p>
        </div>
      </div>

      <!-- Ribbon tied at the middle -->
      <div id="ribbonWrap" class="ribbon-wrap">
        <div class="ribbon-strip left"></div>
        <div class="ribbon-strip right"></div>
        <svg class="ribbon-bow" viewBox="0 0 100 100" fill="none">
          <path id="loopLeft" d="M50 50 C 30 30, 5 30, 8 50 C 5 70, 30 70, 50 50 Z" fill="var(--gold)" stroke="#8a6a34" stroke-width="1.5"/>
          <path id="loopRight" d="M50 50 C 70 30, 95 30, 92 50 C 95 70, 70 70, 50 50 Z" fill="var(--gold-bright)" stroke="#8a6a34" stroke-width="1.5"/>
          <circle id="knot" cx="50" cy="50" r="9" fill="var(--cranberry)" stroke="#5e2020" stroke-width="1.5"/>
        </svg>
      </div>

    </div>
  </div>
  <p class="text-xs tracking-widest uppercase text-[var(--brown)]/50 text-center mt-4">Tap the ribbon to open</p>
  `;
}
function attachSeal(){
  const ribbon = document.getElementById('ribbonWrap');
  const flap = document.getElementById('inviteFlap');
  const continueBtn = document.getElementById('continueBtn');
  if (!ribbon || !flap) return;

  const openInvitation = () => {
    if (ribbon.classList.contains('untying')) return;
    ribbon.classList.add('untying');
    // Ribbon (knot + loops + strips) finishes clearing around 1.78s in.
    // The flap then opens slowly on its own 1.9s curve.
    setTimeout(() => { flap.classList.add('opened'); }, 1750);
    setTimeout(() => {
      continueBtn.classList.remove('opacity-0', 'pointer-events-none');
    }, 1750 + 1600);
  };

  ribbon.addEventListener('click', openInvitation);
  flap.addEventListener('click', openInvitation);
  continueBtn.addEventListener('click', () => { state.step = 1; render(); });
}

/* ---------- Step 1: Welcome ---------- */
function welcomeScreen(){
  const g = state.guest;
  const greetingName = g.householdType === 'fixed' && g.maxSlots == 1
    ? g.householdName
    : g.householdName;

  const already = g.previousResponse && g.previousResponse.length;

  return `
  <div class="invite-card frame bg-[var(--ivory-deep)] rounded-sm p-8 md:p-12">
    ${progressBar(1)}
    ${portraitHTML()}
    <h2 class="font-display text-3xl mb-2 mt-6">Dear ${greetingName},</h2>
    <p class="text-sm leading-relaxed mb-4">
      We would be so happy to have you with us as we begin our forever this Christmas season.
    </p>
    ${already ? `<p class="text-xs italic mb-4 text-[var(--cranberry)]">You've already responded — you can review or update your answers below.</p>` : ``}
    <div class="divider my-5"></div>
    <p class="text-xs uppercase tracking-widest text-[var(--gold)] mb-3">Who's invited</p>
    <ul class="text-sm space-y-1 mb-6">
      ${g.householdType === 'fixed'
        ? g.members.map(m => `<li>• ${m.name}</li>`).join('')
        : `<li>Up to ${g.maxSlots} guest${g.maxSlots > 1 ? 's' : ''} from your household</li>`
      }
    </ul>
    <button id="nextBtn" class="btn-primary w-full py-3 rounded-sm text-sm uppercase tracking-widest" ${isPastDeadline() && !already ? 'disabled' : ''}>
      ${isPastDeadline() && !already ? 'RSVPs are closed' : (already ? 'Review my RSVP' : 'Begin RSVP')}
    </button>
  </div>`;
}
function attachNav(){
  const btn = document.getElementById('nextBtn');
  if (!btn) return;
  btn.addEventListener('click', () => {
    prepareAnswers();
    state.step = 2;
    render();
  });
}

function prepareAnswers(){
  const g = state.guest;
  if (state.answers.length) return; // already prepared

  if (g.previousResponse && g.previousResponse.length){
    state.answers = JSON.parse(JSON.stringify(g.previousResponse));
    return;
  }

  if (g.householdType === 'fixed'){
    state.answers = g.members.map(m => ({
      name: m.name,
      attending: true,
      transport: false,
      transportEligible: !!m.transportEligible,
    }));
  } else {
    const count = Number(g.maxSlots) || 1;
    state.answers = Array.from({length: count}).map((_, i) => ({
      name: "",
      attending: false,
      transport: false,
      transportEligible: !!(g.members[i] && g.members[i].transportEligible),
      slot: i + 1,
      flagged: false,
      flagOverride: null, // host will decide later; guest doesn't set this
    }));
  }
}

/* ---------- Step 2: Details ---------- */
function detailsScreen(){
  const g = state.guest;
  const rows = state.answers.map((a, idx) => {
    if (g.householdType === 'fixed'){
      return `
      <div class="flex items-start gap-3 py-3 border-b border-[var(--gold)]/20">
        <input type="checkbox" class="sprig-check mt-1" data-idx="${idx}" data-field="attending" ${a.attending ? 'checked' : ''}>
        <div class="flex-1">
          <p class="text-sm font-medium">${a.name}</p>
          ${a.transportEligible ? `
            <label class="flex items-center gap-2 mt-2 text-xs text-[var(--brown)]/80">
              <input type="checkbox" class="sprig-check" style="width:16px;height:16px;" data-idx="${idx}" data-field="transport" ${a.transport ? 'checked' : ''}>
              Needs transport service
            </label>` : ``}
        </div>
      </div>`;
    } else {
      return `
      <div class="py-3 border-b border-[var(--gold)]/20">
        <div class="flex items-center gap-3 mb-2">
          <input type="checkbox" class="sprig-check" data-idx="${idx}" data-field="attending" ${a.attending ? 'checked' : ''}>
          <input type="text" placeholder="Guest ${a.slot} name" class="text-input text-sm" data-idx="${idx}" data-field="name" value="${a.name || ''}">
        </div>
        <div id="flagNote-${idx}" class="flag-note ml-8 ${a.name && isSuspiciousEntry(a.name) ? '' : 'hidden'}">⚠ This name will be flagged for the couple to double-check.</div>
        ${a.transportEligible ? `
          <label class="flex items-center gap-2 mt-2 ml-8 text-xs text-[var(--brown)]/80">
            <input type="checkbox" class="sprig-check" style="width:16px;height:16px;" data-idx="${idx}" data-field="transport" ${a.transport ? 'checked' : ''}>
            Needs transport service
          </label>` : ``}
      </div>`;
    }
  }).join('');

  return `
  <div class="invite-card frame bg-[var(--ivory-deep)] rounded-sm p-8 md:p-12">
    ${progressBar(2)}
    ${portraitHTML()}
    <h2 class="font-display text-2xl mb-1 mt-6">Who's coming?</h2>
    <p class="text-xs text-[var(--brown)]/60 mb-4">${g.householdType === 'fixed' ? 'Check off who will attend.' : 'Tell us who you\'re bringing, up to ' + g.maxSlots + ' guest' + (g.maxSlots>1?'s':'') + '.'}</p>
    <div id="rows">${rows}</div>
    <div class="flex gap-3 mt-8">
      <button id="backBtn" class="btn-ghost flex-1 py-3 rounded-sm text-sm uppercase tracking-widest">Back</button>
      <button id="nextBtn" class="btn-primary flex-1 py-3 rounded-sm text-sm uppercase tracking-widest">Continue</button>
    </div>
  </div>`;
}
function attachDetails(){
  document.getElementById('backBtn').addEventListener('click', () => { state.step = 1; render(); });
  document.getElementById('nextBtn').addEventListener('click', () => {
    // finalize flags for flexible slots before moving on
    const g = state.guest;
    if (g.householdType === 'flexible'){
      state.answers.forEach(a => { a.flagged = a.attending && a.name ? isSuspiciousEntry(a.name) : false; });
    }
    state.step = 3;
    render();
  });

  document.getElementById('rows').addEventListener('input', (e) => {
    const idx = e.target.dataset.idx;
    const field = e.target.dataset.field;
    if (idx === undefined) return;
    const a = state.answers[idx];
    if (field === 'attending') a.attending = e.target.checked;
    if (field === 'transport') a.transport = e.target.checked;
    if (field === 'name') {
      a.name = e.target.value;
      const note = document.getElementById('flagNote-' + idx);
      if (note){
        if (a.name && isSuspiciousEntry(a.name)) note.classList.remove('hidden');
        else note.classList.add('hidden');
      }
    }
  });
}

/* ---------- Step 3: Review ---------- */
function reviewScreen(){
  const g = state.guest;
  const attendingList = state.answers.filter(a => a.attending);
  const anyFlagged = state.answers.some(a => a.flagged);

  return `
  <div class="invite-card frame bg-[var(--ivory-deep)] rounded-sm p-8 md:p-12">
    ${progressBar(3)}
    ${portraitHTML()}
    <h2 class="font-display text-2xl mb-4 mt-6">Please confirm</h2>
    ${attendingList.length === 0 ? `
      <p class="text-sm mb-6">We're sorry you can't make it — thank you for letting us know.</p>
    ` : `
      <p class="text-xs uppercase tracking-widest text-[var(--gold)] mb-2">Attending</p>
      <ul class="text-sm space-y-1 mb-4">
        ${attendingList.map(a => `<li>• ${a.name || '(no name given)'} ${a.transport ? '<span class="text-[var(--brown)]/50">— needs transport</span>' : ''} ${a.flagged ? '<span class="flag-note">⚠ flagged for review</span>' : ''}</li>`).join('')}
      </ul>
    `}
    ${anyFlagged ? `<p class="text-xs text-[var(--cranberry)] mb-4">One or more names looked unusual — that's okay, the couple will simply double check with you.</p>` : ``}
    <div class="divider my-5"></div>
    <div class="flex gap-3 mt-6">
      <button id="backBtn" class="btn-ghost flex-1 py-3 rounded-sm text-sm uppercase tracking-widest">Back</button>
      <button id="submitBtn" class="btn-primary flex-1 py-3 rounded-sm text-sm uppercase tracking-widest" ${isPastDeadline() ? 'disabled' : ''}>
        ${isPastDeadline() ? 'RSVPs closed' : 'Confirm & Send'}
      </button>
    </div>
    <p id="submitError" class="text-xs text-[var(--cranberry)] mt-3 hidden"></p>
  </div>`;
}
function attachReview(){
  document.getElementById('backBtn').addEventListener('click', () => { state.step = 2; render(); });
  document.getElementById('submitBtn').addEventListener('click', submitRSVP);
}

async function submitRSVP(){
  const btn = document.getElementById('submitBtn');
  const errEl = document.getElementById('submitError');
  btn.disabled = true;
  btn.textContent = 'Sending…';
  try{
    const res = await fetch(CONFIG.APPS_SCRIPT_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({
        action: 'submitGuestRSVP',
        householdId: householdId,
        responses: state.answers,
      }),
    });
    const data = await res.json();
    if (!data.ok) throw new Error(data.error || 'Something went wrong.');
    state.step = 4;
    render();
  } catch(err){
    errEl.textContent = "We couldn't send your RSVP. Please check your connection and try again.";
    errEl.classList.remove('hidden');
    btn.disabled = false;
    btn.textContent = 'Confirm & Send';
  }
}

/* ---------- Step 4: Done ---------- */
function doneScreen(){
  return `
  <div class="invite-card frame bg-[var(--ivory-deep)] rounded-sm p-10 text-center">
    ${portraitHTML()}
    <div class="confirm-stamp mx-auto mb-6" style="cursor:default;">
      <svg viewBox="0 0 24 24" fill="none" stroke="var(--candle)" stroke-width="1.3">
        <path d="M5 13l4 4L19 7" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
    <h2 class="font-display text-3xl mb-2">Thank you</h2>
    <p class="font-script text-2xl text-[var(--cranberry)] mb-4">we can't wait to celebrate with you</p>
    <p class="text-sm text-[var(--brown)]/70">Your RSVP has been received. See you on ${CONFIG.WEDDING_DATE_DISPLAY}.</p>
  </div>`;
}

/* ---------- Progress bar ---------- */
function progressBar(current){
  const steps = [1,2,3];
  return `
  <div class="flex items-center justify-center">
    ${steps.map((s, i) => `
      <div class="sprig ${s === current ? 'active' : s < current ? 'done' : ''}">${sprigIcon()}</div>
      ${i < steps.length - 1 ? '<div class="sprig-line"></div>' : ''}
    `).join('')}
  </div>`;
}

/* ============================================================
   Boot
   ============================================================ */
async function boot(){
  if (!householdId){ render(); return; }
  render(); // loading state

  try{
    const url = `${CONFIG.APPS_SCRIPT_URL}?action=lookupGuest&id=${encodeURIComponent(householdId)}`;
    const res = await fetch(url);
    const data = await res.json();
    if (!data.ok){
      state.loadError = "We couldn't find an invitation matching this link. Please check the link and try again, or contact the couple directly.";
    } else {
      state.guest = data;
    }
  } catch(err){
    state.loadError = "We couldn't load your invitation right now. Please check your connection and try again.";
  }
  render();
}

boot();
</script>
</body>
</html>
